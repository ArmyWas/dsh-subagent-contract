- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    packChunks: false
    compression: none
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: permission
  config:
    presets:
      contract-eval:
        sandbox: workspace-write
        approval: never
    defaultPreset: contract-eval

# Pin both the endpoint and the adapter default. Continuable children are
# cold-resumed from their descriptor, which does not preserve the root
# initialize() call's maxTokens value.
- id: llm-deepseek
  config:
    baseURL: https://api.deepseek.com
    maxTokens: 4096

# The root receives only the three subagent contract surfaces. Children inherit
# an empty global tool allowlist; the scoped report tool remains available to a
# continuable child.
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1
    toolFilter:
      allow: []

- id: session-telemetry-otel
  disabled: true
- id: user-questions
